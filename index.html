<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AMIR PERODUA Auto Calculator</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f5f8;
  color:#172033;
}

header{
  background:white;
  padding:20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #ddd;
}

.brand b{
  font-size:24px;
  letter-spacing:1px;
}

.brand small{
  display:block;
  color:#647084;
  margin-top:4px;
}

button{
  font:inherit;
  cursor:pointer;
}

.edit-btn{
  background:#eaf0f8;
  color:#244a7c;
  padding:12px 18px;
  border-radius:14px;
  font-weight:bold;
  border:none;
}

.wrap{
  max-width:900px;
  margin:auto;
  padding:22px;
}

.hero{
  background:linear-gradient(135deg,#244a90,#486db0);
  color:white;
  padding:32px;
  border-radius:34px;
}

.hero h1{
  margin:0 0 12px;
  font-size:34px;
}

.hero p{
  font-size:18px;
  opacity:.9;
}

.tabs,
.years{
  display:flex;
  gap:10px;
  margin:22px 0;
}

.tabs button,
.years button{
  flex:1;
  padding:16px;
  border-radius:14px;
  background:white;
  color:#274c83;
  font-weight:bold;
  border:1px solid #ddd;
}

.tabs button.active,
.years button.active{
  background:#244a90;
  color:white;
}

.result{
  background:white;
  color:#111;
  border-radius:24px;
  padding:24px;
  margin-top:16px;
  font-size:28px;
  font-weight:bold;
}

.result input{
  border:0;
  font-size:28px;
  font-weight:bold;
  width:75%;
  outline:none;
}

.status{
  text-align:center;
  margin:22px 0;
  font-size:20px;
  font-weight:bold;
}

.ok{
  color:#39705b;
}

.bad{
  color:#9b4d4d;
}

.cars{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:18px;
}

.car{
  background:white;
  border:3px solid #8aa99c;
  border-radius:24px;
  padding:18px;
  box-shadow:0 5px 15px #00000012;
}

.emoji{
  height:120px;
  background:#eef1f5;
  border-radius:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:70px;
}

.car h2{
  margin:15px 0 6px;
}

.price{
  color:#657083;
}

.monthly{
  font-size:22px;
  color:#244a90;
  font-weight:bold;
  margin:12px 0;
}

.car button{
  width:100%;
  padding:13px;
  background:#244a90;
  color:white;
  border-radius:12px;
  font-weight:bold;
  border:none;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#0009;
  z-index:10;
  padding:18px;
  overflow:auto;
}

.box{
  max-width:700px;
  background:white;
  margin:30px auto;
  padding:24px;
  border-radius:22px;
}

.box h2{
  margin-top:0;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.row input{
  width:100%;
  padding:13px;
  border:1px solid #ccd3dd;
  border-radius:10px;
  font-size:16px;
}

.actions{
  display:flex;
  gap:10px;
  margin-top:18px;
}

.actions button{
  padding:13px 18px;
  border-radius:10px;
  font-weight:bold;
  border:none;
}

.primary{
  background:#244a90;
  color:white;
}

.secondary{
  background:#e8edf3;
}

.danger{
  background:#b43d3d;
  color:white;
}

.admin-car{
  border:1px solid #ddd;
  padding:12px;
  border-radius:12px;
  margin-top:12px;
}

@media(max-width:600px){

  .hero h1{
    font-size:28px;
  }

  .row{
    grid-template-columns:1fr;
  }

  .wrap{
    padding:14px;
  }
}
</style>
</head>

<body>

<header>

<div class="brand">
<b>AMIR PERODUA</b>
<small>AUTO CALCULATE SYSTEM</small>
</div>

<button class="edit-btn" onclick="openAdmin()">
⚙️ EDIT
</button>

</header>


<main class="wrap">

<section class="hero">

<h1>Perodua Auto Calculator</h1>

<p>Semak bajet bulanan atau kelayakan gaji customer.</p>


<div class="tabs">

<button id="budgetTab"
class="active"
onclick="setMode('budget')">

💰 Bajet Bulanan

</button>


<button id="salaryTab"
onclick="setMode('salary')">

👤 Semak Gaji

</button>

</div>


<div class="result">

RM

<input
id="amount"
type="number"
value="1800"
oninput="render()">

</div>

</section>


<div class="years">

<button onclick="setYear(5)">
5 Tahun
</button>

<button onclick="setYear(7)">
7 Tahun
</button>

<button class="active"
onclick="setYear(9)">

9 Tahun

</button>

</div>


<div id="status"
class="status">

</div>


<div id="cars"
class="cars">

</div>

</main>



<!-- ADMIN MODAL -->

<div id="adminModal"
class="modal">

<div class="box">

<h2>✏️ EDIT SISTEM AMIR PERODUA</h2>

<p>
Edit harga kereta.
Perubahan akan disimpan dalam telefon ini.
</p>

<div id="adminCars"></div>

<div class="actions">

<button
class="primary"
onclick="addCar()">

+ Tambah Model

</button>


<button
class="secondary"
onclick="closeAdmin()">

Tutup

</button>

</div>

</div>

</div>



<!-- DETAIL MODAL -->

<div id="detailModal"
class="modal">

<div class="box">

<h2 id="detailTitle"></h2>

<p id="detailText"></p>

<div class="actions">

<button
class="primary"
onclick="closeDetail()">

Tutup

</button>

</div>

</div>

</div>



<script>


const defaults = [

{
name:"BEZZA",
price:36179,
emoji:"🚗"
},

{
name:"AXIA",
price:22000,
emoji:"🚙"
},

{
name:"MYVI",
price:46000,
emoji:"🚘"
},

{
name:"ALZA",
price:62000,
emoji:"🚐"
},

{
name:"ATIVA",
price:62500,
emoji:"🚙"
},

{
name:"ARUZ",
price:72900,
emoji:"🚗"
}

];



let cars =
JSON.parse(
localStorage.getItem("amirCars")
|| "null"
)
|| defaults;


let years = 9;

let mode = "budget";



function pay(price,year){

let rate = 0.0325 / 12;

let months = year * 12;

return price
*
rate
*
Math.pow(
1 + rate,
months
)
/
(
Math.pow(
1 + rate,
months
)
- 1
);

}



function setMode(m){

mode = m;

document
.getElementById("budgetTab")
.classList
.toggle(
"active",
m === "budget"
);


document
.getElementById("salaryTab")
.classList
.toggle(
"active",
m === "salary"
);


render();

}



function setYear(y){

years = y;


document
.querySelectorAll(".years button")
.forEach(function(button){

button
.classList
.toggle(
"active",
button.textContent.trim()
=== y + " Tahun"
);

});


render();

}



function render(){

let amount =
Number(
document
.getElementById("amount")
.value
)
|| 0;


let grid =
document
.getElementById("cars");


let status =
document
.getElementById("status");


grid.innerHTML = "";


let pass = 0;



cars.forEach(function(car,index){

let monthly =
Math.round(
pay(
car.price,
years
)
);


let eligible;


if(mode === "budget"){

eligible =
monthly <= amount;

}else{

eligible =
amount >= monthly / 0.15;

}


if(eligible){

pass++;

}


let value;


if(mode === "budget"){

value =
"Anggaran RM "
+
monthly.toLocaleString()
+
"/bulan";

}else{

value =
"Gaji anggaran RM "
+
Math.ceil(
monthly / 0.15
).toLocaleString();

}


grid.innerHTML +=

'<div class="car">' +

'<div class="emoji">' +
(car.emoji || "🚗") +
'</div>' +

'<h2>' +
car.name +
'</h2>' +

'<div class="price">' +
'Harga anggaran: RM ' +
Number(car.price)
.toLocaleString() +
'</div>' +

'<div class="monthly">' +
value +
'</div>' +

'<button onclick="showCar(' +
index +
')">' +

'Lihat Anggaran' +

'</button>' +

'</div>';

});



status.innerHTML =

'<span class="ok">' +

pass +

' model LAYAK</span>' +

' • ' +

'<span class="bad">' +

(cars.length - pass) +

' model TIDAK LAYAK</span>' +

'<br>' +

'<small>' +

years +

' Tahun</small>';

}



function showCar(index){

let car = cars[index];


let monthly =
Math.round(
pay(
car.price,
years
)
);


document
.getElementById("detailTitle")
.textContent =
car.name;


document
.getElementById("detailText")
.innerHTML =

'Harga anggaran: <b>RM ' +

Number(car.price)
.toLocaleString() +

'</b>' +

'<br><br>' +

'Tempoh loan: <b>' +

years +

' Tahun</b>' +

'<br>' +

'Anggaran bulanan: <b>RM ' +

monthly
.toLocaleString() +

'</b>' +

'<br><br>' +

'<small>*Anggaran sahaja. Kelulusan sebenar bergantung kepada bank dan profil customer.</small>';



document
.getElementById("detailModal")
.style.display =
"block";

}



function closeDetail(){

document
.getElementById("detailModal")
.style.display =
"none";

}



function openAdmin(){

buildAdmin();


document
.getElementById("adminModal")
.style.display =
"block";

}



function closeAdmin(){

document
.getElementById("adminModal")
.style.display =
"none";


render();

}



function buildAdmin(){

let box =
document
.getElementById("adminCars");


box.innerHTML = "";


cars.forEach(function(car,index){

box.innerHTML +=

'<div class="admin-car">' +

'<div class="row">' +

'<input value="' +

car.name +

'" oninput="cars[' +

index +

'].name=this.value;save()">' +


'<input type="number" value="' +

car.price +

'" oninput="cars[' +

index +

'].price=Number(this.value);save()">' +

'</div>' +


'<div class="actions">' +

'<button class="danger" onclick="deleteCar(' +

index +

')">' +

'Padam' +

'</button>' +

'</div>' +

'</div>';

});

}



function save(){

localStorage.setItem(

"amirCars",

JSON.stringify(cars)

);

}



function deleteCar(index){

if(
confirm("Padam model ini?")
){

cars.splice(
index,
1
);


save();


buildAdmin();

}

}



function addCar(){

cars.push({

name:"MODEL BARU",

price:50000,

emoji:"🚗"

});


save();


buildAdmin();

}



render();


</script>

</body>
</html>
