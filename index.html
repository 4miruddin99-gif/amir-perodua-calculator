<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AMIR PERODUA Auto Calculator</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f5f8;
  color:#172033;
}

header{
  background:#fff;
  padding:20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #ddd;
}

.brand b{
  font-size:24px;
  letter-spacing:1px;
}

.brand small{
  display:block;
  color:#647084;
  margin-top:4px;
}

.edit-top{
  border:0;
  padding:12px 18px;
  border-radius:20px;
  font-weight:bold;
  color:#35507f;
  background:#e9edf4;
  cursor:pointer;
}

.wrap{
  max-width:900px;
  margin:auto;
  padding:20px;
}

.hero{
  background:#365da8;
  color:#fff;
  padding:28px;
  border-radius:30px;
}

.hero h1{
  margin:0 0 10px;
  font-size:32px;
}

.hero p{
  margin-bottom:20px;
  opacity:.9;
}

.tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.tab{
  padding:14px;
  border-radius:15px;
  border:1px solid rgba(255,255,255,.6);
  background:transparent;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.tab.active{
  background:#fff;
  color:#365da8;
}

.input-box{
  margin-top:18px;
  background:#fff;
  border-radius:25px;
  padding:20px;
  display:flex;
  align-items:center;
}

.input-box span{
  color:#365da8;
  font-size:26px;
  font-weight:bold;
  margin-right:15px;
}

.input-box input{
  border:0;
  outline:none;
  width:100%;
  font-size:28px;
  font-weight:bold;
}

.years{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin:20px 0;
}

.year-btn{
  border:1px solid #ccd3df;
  background:#fff;
  padding:16px;
  border-radius:18px;
  font-weight:bold;
  color:#365da8;
  cursor:pointer;
}

.year-btn.active{
  background:#365da8;
  color:#fff;
}

.status{
  text-align:center;
  font-size:22px;
  font-weight:bold;
  margin:25px 0 5px;
}

.ok{color:#3e705a}
.no{color:#944b4b}

.budget-info{
  text-align:center;
  color:#687386;
  margin-bottom:20px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px;
}

.car{
  background:#fff;
  border:2px solid #b8d0c2;
  border-radius:28px;
  padding:14px;
  cursor:pointer;
  transition:.2s;
}

.car:active{
  transform:scale(.98);
}

.car img{
  width:100%;
  height:150px;
  object-fit:cover;
  background:#e7ebf0;
  border-radius:20px;
}

.car h2{
  margin:14px 0 8px;
}

.price{
  font-size:18px;
  font-weight:bold;
}

.badge{
  display:inline-block;
  margin-top:12px;
  padding:8px 12px;
  border-radius:20px;
  background:#edf6f0;
  color:#3e705a;
  font-weight:bold;
}

.badge.no{
  background:#f8eeee;
  color:#944b4b;
}

.fab{
  position:fixed;
  right:20px;
  bottom:20px;
  background:#17233d;
  color:white;
  border:0;
  padding:16px 20px;
  border-radius:30px;
  font-weight:bold;
  cursor:pointer;
  z-index:10;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:100;
  overflow:auto;
}

.modal-box{
  background:#fff;
  max-width:600px;
  margin:30px auto;
  padding:25px;
  border-radius:25px;
}

.row{
  margin-bottom:15px;
}

.row label{
  display:block;
  font-weight:bold;
  margin-bottom:6px;
}

.row input{
  width:100%;
  padding:14px;
  border:1px solid #ccc;
  border-radius:12px;
  font-size:16px;
}

.action{
  width:100%;
  border:0;
  padding:15px;
  border-radius:15px;
  background:#365da8;
  color:#fff;
  font-size:16px;
  font-weight:bold;
  margin-top:8px;
  cursor:pointer;
}

.close{
  background:#777;
}

.danger{
  background:#b94a4a;
}

.model-list{
  border:1px solid #ddd;
  padding:15px;
  border-radius:15px;
  margin-top:12px;
}

.variant{
  background:#f6f8fb;
  border:1px solid #d8dee8;
  padding:14px;
  border-radius:15px;
  margin-top:10px;
}

.variant strong{
  display:block;
  font-size:18px;
}

.back-btn{
  margin-bottom:15px;
  border:0;
  background:#365da8;
  color:#fff;
  padding:12px 18px;
  border-radius:15px;
  font-weight:bold;
  cursor:pointer;
}

.detail-title{
  font-size:28px;
  margin:10px 0 20px;
}

@media(max-width:600px){

  .wrap{padding:14px}

  .hero h1{font-size:27px}

  .grid{gap:12px}

  .car h2{font-size:18px}

  .price{font-size:15px}

  .status{font-size:18px}
}
</style>
</head>

<body>

<header>
  <div class="brand">
    <b>AMIR PERODUA</b>
    <small>AUTO CALCULATE SYSTEM</small>
  </div>

  <button class="edit-top" onclick="openAdmin()">⚙️ EDIT</button>
</header>

<main class="wrap" id="home">

<section class="hero">

<h1>Perodua Auto Calculator</h1>

<p id="heroText">Masukkan bajet bulanan customer dan semak model yang sesuai.</p>

<div class="tabs">

<button class="tab active" id="budgetTab" onclick="setMode('budget')">
💰 Bajet Bulanan
</button>

<button class="tab" id="salaryTab" onclick="setMode('salary')">
👤 Semak Gaji
</button>

</div>

<div class="input-box">
<span>RM</span>
<input type="number" id="amount" placeholder="1800" oninput="render()">
</div>

</section>

<div class="years">

<button class="year-btn" onclick="setYear(5,this)">5 Tahun</button>

<button class="year-btn" onclick="setYear(7,this)">7 Tahun</button>

<button class="year-btn active" onclick="setYear(9,this)">9 Tahun</button>

</div>

<div class="status">
<span class="ok" id="okCount">0 model LULUS</span>
•
<span class="no" id="noCount">0 model GAGAL</span>
</div>

<div class="budget-info" id="budgetInfo">
Masukkan bajet untuk semakan.
</div>

<div class="grid" id="carGrid"></div>

</main>


<main class="wrap" id="detail" style="display:none">

<button class="back-btn" onclick="goHome()">← KEMBALI</button>

<h1 class="detail-title" id="detailTitle"></h1>

<div id="variantList"></div>

</main>


<button class="fab" onclick="openAdmin()">
✏️ EDIT HARGA / GAMBAR
</button>


<!-- ADMIN -->

<div class="modal" id="adminModal">

<div class="modal-box">

<h2>⚙️ EDIT SISTEM</h2>

<button class="action" onclick="newModel()">
➕ TAMBAH MODEL BARU
</button>

<div id="adminList"></div>

<button class="action close" onclick="closeAdmin()">
TUTUP
</button>

</div>

</div>


<!-- EDIT MODEL -->

<div class="modal" id="editModal">

<div class="modal-box">

<h2 id="editTitle">EDIT MODEL</h2>

<div class="row">
<label>Nama Model</label>
<input id="editName">
</div>

<div class="row">
<label>Gambar Kereta</label>
<input id="editImage" type="file" accept="image/*" onchange="previewImage()">
<img id="imagePreview" style="width:100%;margin-top:10px;border-radius:15px;display:none">
</div>

<button class="action" onclick="saveModel()">💾 SIMPAN MODEL</button>

<button class="action danger" onclick="deleteModel()">🗑️ PADAM MODEL</button>

<button class="action close" onclick="closeEdit()">BATAL</button>

</div>

</div>


<!-- VARIANT EDIT -->

<div class="modal" id="variantModal">

<div class="modal-box">

<h2 id="variantTitle">EDIT VARIAN</h2>

<div class="row">
<label>Nama Varian</label>
<input id="variantName">
</div>

<div class="row">
<label>Harga</label>
<input id="variantPrice" type="number">
</div>

<button class="action" onclick="saveVariant()">💾 SIMPAN VARIAN</button>

<button class="action danger" onclick="deleteVariant()">🗑️ PADAM VARIAN</button>

<button class="action close" onclick="closeVariant()">BATAL</button>

</div>

</div>


<script>

/* DATA MODEL + VARIAN */

const defaults=[

{
name:"BEZZA",
img:"https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?auto=format&fit=crop&w=600&q=80",
variants:[
{name:"1.0 G MT",price:36197},
{name:"1.0 G CVT",price:38197},
{name:"1.3 X",price:43597},
{name:"1.3 AV",price:52047}
]
},

{
name:"AXIA",
img:"https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=600&q=80",
variants:[
{name:"1.0 E",price:23276},
{name:"1.0 G",price:38276},
{name:"1.0 X",price:40276},
{name:"1.0 SE",price:44276},
{name:"1.0 AV",price:51054}
]
},

{
name:"MYVI",
img:"https://images.unsplash.com/photo-1542282088-fe8426682b8f?auto=format&fit=crop&w=600&q=80",
variants:[
{name:"1.3 G",price:48474},
{name:"1.3 X",price:50474},
{name:"1.5 X",price:55274},
{name:"1.5 H",price:58274},
{name:"1.5 AV",price:62302}
]
},

{
name:"ALZA",
img:"https://images.unsplash.com/photo-1551830820-330a71b99659?auto=format&fit=crop&w=600&q=80",
variants:[
{name:"X",price:64993},
{name:"H",price:69993},
{name:"AV",price:75200}
]
},

{
name:"ATIVA",
img:"https://images.unsplash.com/photo-1504215680853-026ed2a45def?auto=format&fit=crop&w=600&q=80",
variants:[
{name:"X",price:62500},
{name:"H",price:68200},
{name:"AV",price:75000}
]
},

{
name:"ARUZ",
img:"https://images.unsplash.com/photo-1511919884226-fd3cad34687c?auto=format&fit=crop&w=600&q=80",
variants:[
{name:"X",price:72900},
{name:"AV",price:77900}
]
}

];

let cars;

try{
cars=JSON.parse(localStorage.getItem("amirCarsV2"))||defaults;
}catch(e){
cars=defaults;
}

let mode="budget";
let years=9;
let selectedModel=null;
let editingModel=null;
let editingVariant=null;


/* KIRA BULANAN */

function monthly(price){

let rate=0.0325;
let loan=price*0.9;
let r=rate/12;
let n=years*12;

return loan*(r*Math.pow(1+r,n))/
(Math.pow(1+r,n)-1);

}


function currentAmount(){
return Number(document.getElementById("amount").value)||0;
}


/* MODE */

function setMode(m){

mode=m;

document.getElementById("budgetTab").classList.remove("active");
document.getElementById("salaryTab").classList.remove("active");

if(m==="budget"){

document.getElementById("budgetTab").classList.add("active");
document.getElementById("heroText").innerText=
"Masukkan bajet bulanan customer dan semak model yang sesuai.";

}else{

document.getElementById("salaryTab").classList.add("active");
document.getElementById("heroText").innerText=
"Masukkan gaji bulanan customer untuk anggaran kelayakan.";

}

render();

}


/* TAHUN */

function setYear(y,btn){

years=y;

document.querySelectorAll(".year-btn").forEach(b=>{
b.classList.remove("active");
});

btn.classList.add("active");

render();

}


/* SEMAK KELAYAKAN */

function eligible(price){

let amount=currentAmount();

if(amount<=0) return false;

let pay=monthly(price);

if(mode==="budget"){
return pay<=amount;
}

return pay<=amount*0.30;

}


/* RENDER MODEL */

function render(){

let grid=document.getElementById("carGrid");

grid.innerHTML="";

let pass=0;

cars.forEach((car,index)=>{

let modelPass=
car.variants.some(v=>eligible(v.price));

if(modelPass) pass++;

let prices=car.variants.map(v=>v.price);

let min=Math.min(...prices);
let max=Math.max(...prices);

let card=document.createElement("div");

card.className="car "+(modelPass?"":"not-ok");

card.onclick=()=>showModel(index);

card.innerHTML=`

<img src="${car.img}">

<h2>${car.name}</h2>

<div class="price">
RM ${min.toLocaleString()} –
RM ${max.toLocaleString()}
</div>

<div class="badge ${modelPass?"":"no"}">
${modelPass?"✓ ADA VARIAN LULUS":"✕ TIADA VARIAN LULUS"}
</div>

`;

grid.appendChild(card);

});

document.getElementById("okCount").innerText=
pass+" model LULUS";

document.getElementById("noCount").innerText=
(cars.length-pass)+" model GAGAL";

let amount=currentAmount();

document.getElementById("budgetInfo").innerText=
amount
?
(mode==="budget"
? "Bajet RM "+amount.toLocaleString()+" • Loan "+years+" Tahun"
: "Gaji RM "+amount.toLocaleString()+" • Anggaran komitmen 30%")
:
"Masukkan nilai untuk semakan.";

}


/* PAPAR VARIAN */

function showModel(index){

selectedModel=index;

document.getElementById("home").style.display="none";
document.getElementById("detail").style.display="block";

let car=cars[index];

document.getElementById("detailTitle").innerText=
car.name+" – SENARAI VARIAN";

let list=document.getElementById("variantList");

list.innerHTML="";

car.variants.forEach(v=>{

let pass=eligible(v.price);

let pay=monthly(v.price);

let div=document.createElement("div");

div.className="variant";

div.innerHTML=`

<strong>${v.name}</strong>

<p>Harga: RM ${v.price.toLocaleString()}</p>

<p>Anggaran Bulanan: RM ${pay.toFixed(0)}</p>

<div class="badge ${pass?"":"no"}">
${pass?"✓ LULUS":"✕ GAGAL"}
</div>

`;

list.appendChild(div);

});

}


/* KEMBALI */

function goHome(){

document.getElementById("detail").style.display="none";
document.getElementById("home").style.display="block";

}


/* ADMIN */

function openAdmin(){

document.getElementById("adminModal").style.display="block";

renderAdmin();

}

function closeAdmin(){

document.getElementById("adminModal").style.display="none";

}


function renderAdmin(){

let list=document.getElementById("adminList");

list.innerHTML="";

cars.forEach((car,index)=>{

let div=document.createElement("div");

div.className="model-list";

div.innerHTML=`

<b>${car.name}</b>

<br>

${car.variants.length} Varian

<button class="action" onclick="editModel(${index})">
EDIT MODEL / VARIAN
</button>

`;

list.appendChild(div);

});

}


/* EDIT MODEL */

function editModel(index){

editingModel=index;

let car=cars[index];

document.getElementById("editTitle").innerText=
"EDIT "+car.name;

document.getElementById("editName").value=car.name;

document.getElementById("imagePreview").src=car.img;
document.getElementById("imagePreview").style.display="block";

document.getElementById("editModal").style.display="block";

}


/* MODEL BARU */

function newModel(){

editingModel=null;

document.getElementById("editTitle").innerText="TAMBAH MODEL";

document.getElementById("editName").value="";

document.getElementById("imagePreview").style.display="none";

document.getElementById("editModal").style.display="block";

}


/* PREVIEW GAMBAR */

function previewImage(){

let file=document.getElementById("editImage").files[0];

if(!file)return;

let reader=new FileReader();

reader.onload=function(e){

document.getElementById("imagePreview").src=e.target.result;

document.getElementById("imagePreview").style.display="block";

};

reader.readAsDataURL(file);

}


/* SAVE MODEL */

function saveModel(){

let name=document.getElementById("editName").value.trim();

if(!name){
alert("Masukkan nama model");
return;
}

let img=document.getElementById("imagePreview").src;

if(editingModel===null){

cars.push({
name:name,
img:img,
variants:[]
});

}else{

cars[editingModel].name=name;
cars[editingModel].img=img;

}

saveData();

closeEdit();

closeAdmin();

render();

}


/* DELETE MODEL */

function deleteModel(){

if(editingModel===null){
closeEdit();
return;
}

if(confirm("Padam model ini?")){

cars.splice(editingModel,1);

saveData();

closeEdit();

closeAdmin();

render();

}

}


function closeEdit(){
document.getElementById("editModal").style.display="none";
}


/* VARIANT FUNCTIONS */

function openVariant(modelIndex,variantIndex=null){

selectedModel=modelIndex;
editingVariant=variantIndex;

let modal=document.getElementById("variantModal");

if(variantIndex===null){

document.getElementById("variantTitle").innerText="TAMBAH VARIAN";
document.getElementById("variantName").value="";
document.getElementById("variantPrice").value="";

}else{

let v=cars[modelIndex].variants[variantIndex];

document.getElementById("variantTitle").innerText="EDIT VARIAN";

document.getElementById("variantName").value=v.name;
document.getElementById("variantPrice").value=v.price;

}

modal.style.display="block";

}


function saveVariant(){

let name=document.getElementById("variantName").value.trim();

let price=Number(document.getElementById("variantPrice").value);

if(!name||!price){

alert("Sila isi nama dan harga");

return;

}

let model=cars[selectedModel];

if(editingVariant===null){

model.variants.push({
name:name,
price:price
});

}else{

model.variants[editingVariant]={
name:name,
price:price
};

}

saveData();

closeVariant();

render();

}


function deleteVariant(){

if(editingVariant===null){

closeVariant();

return;

}

let model=cars[selectedModel];

model.variants.splice(editingVariant,1);

saveData();

closeVariant();

render();

}


function closeVariant(){

document.getElementById("variantModal").style.display="none";

}


/* SIMPAN */

function saveData(){

localStorage.setItem(
"amirCarsV2",
JSON.stringify(cars)
);

}


/* START */

render();

</script>

</body>
</html>
