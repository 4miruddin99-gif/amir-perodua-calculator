<script>

========================================= */

const defaultCars = [

{

["1.0 G (MT)",36197],

["1.0 E (MT)",23276],

["1.0 SE (AT)",51054]
]
},

{

price:"48,474 – 62,302",
image:"myvi.png",
variants:[
["1.3 G (CVT)",48474],
["1.3 X (CVT)",51900],

["1.5 AV (CVT)",62302]
]
},

{

image:"alza.png",
variants:[
["1.5 X",64993],
["1.5 H",70993],
["1.5 AV",78358]
]
},

{
name:"ATIVA",
price:"61,919 – 76,127",
image:"ativa.png",
variants:[
["1.0 X Metallic (AT)",61919],
["1.0 H Metallic (AT)",69859],
["1.0 H S/Metallic (AT)",70387],
["1.0 AV Metallic (AT)",75299],
["1.0 AV S/Metallic (AT)",75827],
["1.0 AV 2T S/Metallic (AT)",76127]
]
},

{
name:"ARUZ",
price:"75,762 – 80,902",
image:"aruz.png",
variants:[
["1.5 X",75762],
["1.5 AV",80902]
]
}

];


/* =========================================
LOAD DATA SAFELY
========================================= */

let savedCars = null;

try{
savedCars = JSON.parse(localStorage.getItem("amirPeroduaCars"));
}catch(e){
savedCars = null;
}

let cars = savedCars || JSON.parse(JSON.stringify(defaultCars));


/* NORMALIZE DATA */

cars.forEach(car=>{

if(!Array.isArray(car.variants)){
car.variants = [];
}

car.variants = car.variants.map(variant=>{

return [
variant[0] || "Varian",
variant[1] || 0
];

});

});


let selectedYear = 9;
let currentMode = "budget";


/* =========================================
SAFE NUMBER
========================================= */

function toNumber(value){

if(value === null || value === undefined){
return 0;
}

const cleaned = String(value)
.replace(/,/g,"")
.replace(/[^\d.]/g,"");

const number = Number(cleaned);

return isNaN(number) ? 0 : number;

}


/* =========================================
FORMAT MONEY
========================================= */

function formatMoney(number){

const value = toNumber(number);

return Math.round(value).toLocaleString("en-MY");

}


/* =========================================
CALCULATE MONTHLY
FLAT RATE HIRE PURCHASE
========================================= */

function calculateMonthly(price){

const carPrice = toNumber(price);

if(carPrice <= 0){
return 0;
}

const annualRate = 0.0325;
const years = Number(selectedYear) || 9;

const totalInterest =
carPrice * annualRate * years;

const totalPayment =
carPrice + totalInterest;

const months =
years * 12;

if(months <= 0){
return 0;
}

const monthly =
totalPayment / months;

return Math.round(monthly);

}


/* =========================================
SET MODE
========================================= */

function setMode(mode){

currentMode = mode;

document
.getElementById("budgetMode")
.classList.toggle(
"active",
mode === "budget"
);

document
.getElementById("salaryMode")
.classList.toggle(
"active",
mode === "salary"
);


const input =
document.getElementById("budgetInput");

const title =
document.getElementById("inputTitle");


if(mode === "budget"){

input.placeholder = "1800";

title.textContent =
"MASUKKAN BAJET BULANAN ANDA";

}else{

input.placeholder = "3000";

title.textContent =
"MASUKKAN GAJI BULANAN ANDA";

}

renderModels();

}


/* =========================================
CLEAR INPUT
========================================= */

function clearBudget(){

document
.getElementById("budgetInput")
.value = "";

renderModels();

}


/* =========================================
SET YEAR
========================================= */

function setYear(year,button){

selectedYear = Number(year);

document
.querySelectorAll(".year-btn")
.forEach(btn=>{
btn.classList.remove("active");
});

button.classList.add("active");

renderModels();

}


/* =========================================
CHECK VARIANT ELIGIBILITY
========================================= */

function isVariantEligible(price){

const input =
toNumber(
document
.getElementById("budgetInput")
.value
);

if(input <= 0){
return false;
}


const monthly =
calculateMonthly(price);

if(monthly <= 0){
return false;
}


/* BAJET BULANAN */

if(currentMode === "budget"){

return input >= monthly;

}


/* SEMAK GAJI */

if(currentMode === "salary"){

return input >= monthly * 3;

}

return false;

}


/* =========================================
RENDER MODELS
========================================= */

function renderModels(){

const grid =
document.getElementById("modelGrid");

grid.innerHTML = "";


let passModels = 0;
let failModels = 0;


cars.forEach((car,index)=>{

let passVariants = 0;
let failVariants = 0;


/* CHECK EVERY VARIANT */

car.variants.forEach(variant=>{

const eligible =
isVariantEligible(variant[1]);

if(eligible){
passVariants++;
}else{
failVariants++;
}

});


/* MODEL LULUS IF AT LEAST 1 VARIANT */

const modelEligible =
passVariants > 0;


/* COUNT MODEL */

if(modelEligible){
passModels++;
}else{
failModels++;
}


/* IMAGE */

let imageHTML = "";


if(
car.image &&
(
String(car.image).startsWith("data:") ||
String(car.image).startsWith("http") ||
String(car.image).includes(".png") ||
String(car.image).includes(".jpg") ||
String(car.image).includes(".jpeg") ||
String(car.image).includes(".webp")
)
){

imageHTML = `
<img
src="${car.image}"
alt="${car.name}"
onerror="this.style.display='none';this.parentElement.innerHTML='<div class=car-emoji>🚗</div>'"
>
`;

}else{

imageHTML = `
<div class="car-emoji">
${car.image || "🚗"}
</div>
`;

}


/* BADGE */

let badgeText = "";

if(passVariants > 0){

badgeText =
`✓ LULUS ${passVariants}/${car.variants.length} VARIAN`;

}else{

badgeText =
`× GAGAL SEMUA VARIAN`;

}


/* DISPLAY */

grid.innerHTML += `

<div
class="car-card ${modelEligible ? "pass" : ""}"
onclick="openCar(${index})"
>

<div class="car-image">

${imageHTML}

</div>


<div class="car-info">

<div class="car-name">
${car.name}
</div>


<div class="car-price">
RM ${car.price}
</div>


<div
class="
result-badge
${modelEligible ? "badge-pass" : "badge-fail"}
"
>

${badgeText}

</div>

</div>

</div>

`;

});


/* STATUS */

document
.getElementById("passCount")
.textContent =
passModels + " model LULUS";


document
.getElementById("failCount")
.textContent =
failModels + " model GAGAL";

}


/* =========================================
OPEN CAR DETAIL
========================================= */

function openCar(index){

const car = cars[index];

let variantsHTML = "";


car.variants.forEach(variant=>{

const variantName =
variant[0] || "Varian";

const variantPrice =
toNumber(variant[1]);


const monthly =
calculateMonthly(variantPrice);


const layak =
isVariantEligible(variantPrice);


/* STATUS TEXT */

const statusText =
layak
? "✓ LULUS"
: "× GAGAL";


variantsHTML += `

<div
class="
variant-row
${layak ? "" : "fail-variant"}
"
>

<div>

<div class="variant-name">
${variantName}
</div>


<div class="variant-price">

RM ${formatMoney(variantPrice)}

<br>

<span
class="
${layak
? "variant-status-pass"
: "variant-status-fail"
}
"
>

${statusText}

</span>

</div>

</div>


<div class="variant-month">

RM ${formatMoney(monthly)}

<small>/bulan</small>

</div>

</div>

`;

});


document
.getElementById("detailContent")
.innerHTML = `

<div class="modal-title">
${car.name}
</div>


<div class="modal-subtitle">
ANGGARAN ${selectedYear} TAHUN
</div>


${variantsHTML}

`;


document
.getElementById("detailModal")
.style.display = "block";

}


/* =========================================
CLOSE MODAL
========================================= */

function closeModal(id){

document
.getElementById(id)
.style.display = "none";

}


/* =========================================
NAVIGATION
========================================= */

function setNav(button){

document
.querySelectorAll(".nav-btn")
.forEach(btn=>{
btn.classList.remove("active");
});

button.classList.add("active");

}


function showModels(button){

setNav(button);

window.scrollTo({
top:0,
behavior:"smooth"
});

}


function showCalculator(button){

setNav(button);

document
.getElementById("calculatorModal")
.style.display = "block";

}


function showInfo(button){

setNav(button);

document
.getElementById("infoModal")
.style.display = "block";

}


/* =========================================
LOAN MODE
========================================= */

function setLoanMode(dp){

document
.getElementById("calcDP")
.value = dp;


document
.getElementById("fullLoanBtn")
.classList.toggle(
"active",
dp === 0
);


document
.getElementById("dpLoanBtn")
.classList.toggle(
"active",
dp === 10
);

}


/* =========================================
MANUAL CALCULATOR
========================================= */

function manualCalculate(){

const price =
toNumber(
document
.getElementById("calcPrice")
.value
);


const dp =
toNumber(
document
.getElementById("calcDP")
.value
);


const years =
toNumber(
document
.getElementById("calcYear")
.value
);


const rate =
toNumber(
document
.getElementById("calcRate")
.value
) / 100;


/* VALIDATION */

if(price <= 0){

alert("Sila masukkan harga kereta.");

return;

}


/* LOAN AMOUNT */

const downpayment =
price * dp / 100;


const loan =
price - downpayment;


/* FLAT RATE INTEREST */

const totalInterest =
loan * rate * years;


/* TOTAL PAYMENT */

const totalPayment =
loan + totalInterest;


/* MONTHLY */

const months =
years * 12;


const monthly =
months > 0
? totalPayment / months
: 0;


/* DISPLAY */

document
.getElementById("calcResult")
.textContent =
"RM " +
formatMoney(monthly) +
" /bulan";


document
.getElementById("calcDetail")
.textContent =

"Loan RM " +
formatMoney(loan) +
" • DP RM " +
formatMoney(downpayment) +
" • " +
years +
" Tahun • " +
(rate * 100).toFixed(2) +
"%";

}


/* =========================================
SETTINGS
========================================= */

function openSettings(){

renderSettings();

document
.getElementById("settingsModal")
.style.display = "block";

}


/* =========================================
RENDER SETTINGS
========================================= */

function renderSettings(){

const list =
document.getElementById("settingsList");

list.innerHTML = "";


cars.forEach((car,index)=>{

list.innerHTML += `

<div class="setting-card">

<h3>
${car.name}
</h3>


<div class="setting-row">


<input
data-index="${index}"
data-field="name"
value="${car.name}"
placeholder="Nama Model"
>


<input
data-index="${index}"
data-field="price"
value="${car.price}"
placeholder="Harga"
>


</div>


<label>
Gambar Kereta
</label>


<input
data-index="${index}"
data-field="image"
value="${car.image || ""}"
placeholder="Contoh: bezza.png atau URL gambar"
>


<input
type="file"
accept="image/*"
onchange="uploadImage(event,${index})"
>


<label>

Varian

<br>

<small>

Format:
Nama Varian | Harga

</small>

</label>


<textarea
rows="6"
data-index="${index}"
data-field="variants"
>${car.variants.map(v=>(v[0] || "Varian")+"|"+toNumber(v[1])).join("\n")}</textarea>


<button
class="delete-btn"
onclick="deleteCar(${index})"
>

Padam Model

</button>


</div>

`;

});

}


/* =========================================
UPLOAD IMAGE
========================================= */

function uploadImage(event,index){

const file =
event.target.files[0];

if(!file){
return;
}


const reader =
new FileReader();


reader.onload = function(e){

cars[index].image =
e.target.result;


/* SAVE IMAGE */

localStorage.setItem(
"amirPeroduaCars",
JSON.stringify(cars)
);


alert(
"Gambar berjaya dimasukkan."
);

};


reader.readAsDataURL(file);

}


/* =========================================
SAVE SETTINGS
========================================= */

function saveSettings(){

document
.querySelectorAll("[data-index]")
.forEach(input=>{

const index =
Number(input.dataset.index);

const field =
input.dataset.field;


/* VARIANTS */

if(field === "variants"){

cars[index].variants =

input.value

.split("\n")

.filter(x => x.trim() !== "")

.map(line=>{

const parts =
line.split("|");


return [

(parts[0] || "Varian Baru").trim(),

toNumber(parts[1])

];

});

}


/* OTHER DATA */

else{

cars[index][field] =
input.value;

}

});


/* SAVE */

localStorage.setItem(
"amirPeroduaCars",
JSON.stringify(cars)
);


/* CLOSE */

closeModal("settingsModal");


/* REFRESH */

renderModels();


alert("Berjaya disimpan!");

}


/* =========================================
ADD NEW CAR
========================================= */

function addNewCar(){

cars.push({

name:"MODEL BARU",

price:"0 – 0",

image:"🚗",

variants:[
["Varian Baru",0]
]

});

renderSettings();

}


/* =========================================
DELETE CAR
========================================= */

function deleteCar(index){

if(!confirm("Padam model ini?")){
return;
}

cars.splice(index,1);

renderSettings();

}


/* =========================================
RESET DEFAULT
========================================= */

function resetDefaultCars(){

if(
!confirm(
"Reset semua model kepada data asal?"
)
){
return;
}


cars =
JSON.parse(
JSON.stringify(defaultCars)
);


localStorage.removeItem(
"amirPeroduaCars"
);


renderSettings();

renderModels();


alert(
"Data telah reset kepada asal."
);

}


/* =========================================
CLOSE OUTSIDE
========================================= */

window.onclick =
function(event){

document
.querySelectorAll(".modal")
.forEach(modal=>{

if(event.target === modal){

modal.style.display = "none";

}

});

};


/* =========================================
START APP
========================================= */

renderModels();

</script>
