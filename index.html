<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AMIR PERODUA Auto Calculator</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f5f8;
  color:#172033;
}

header{
  background:white;
  padding:20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #ddd;
}

.brand b{
  font-size:24px;
  letter-spacing:1px;
}

.brand small{
  display:block;
  color:#647084;
  margin-top:4px;
}

.edit-top{
  border:0;
  padding:12px 18px;
  border-radius:20px;
  font-weight:bold;
  color:#35507f;
  background:#e9edf4;
  cursor:pointer;
}

.wrap{
  max-width:900px;
  margin:auto;
  padding:20px;
}

.hero{
  background:#365da8;
  color:white;
  padding:28px;
  border-radius:30px;
}

.hero h1{
  margin:0 0 10px;
  font-size:32px;
}

.hero p{
  margin-bottom:20px;
  opacity:.9;
}

.tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.tab{
  padding:14px;
  border-radius:15px;
  border:1px solid rgba(255,255,255,.6);
  background:transparent;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.tab.active{
  background:white;
  color:#365da8;
}

.input-box{
  margin-top:18px;
  background:white;
  border-radius:25px;
  padding:20px;
  display:flex;
  align-items:center;
}

.input-box span{
  color:#365da8;
  font-size:26px;
  font-weight:bold;
  margin-right:15px;
}

.input-box input{
  border:0;
  outline:none;
  width:100%;
  font-size:28px;
  font-weight:bold;
}

.years{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin:20px 0;
}

.year-btn{
  border:1px solid #ccd3df;
  background:white;
  padding:16px;
  border-radius:18px;
  font-weight:bold;
  color:#365da8;
  cursor:pointer;
}

.year-btn.active{
  background:#365da8;
  color:white;
}

.status{
  text-align:center;
  font-size:22px;
  font-weight:bold;
  margin:25px 0 5px;
}

.ok{
  color:#3e705a;
}

.no{
  color:#944b4b;
}

.budget-info{
  text-align:center;
  color:#687386;
  margin-bottom:20px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px;
}

.car{
  background:white;
  border:2px solid #b8d0c2;
  border-radius:28px;
  padding:14px;
  cursor:pointer;
}

.car.not-ok{
  border-color:#dfb9b9;
}

.car img{
  width:100%;
  height:160px;
  object-fit:cover;
  background:#e7ebf0;
  border-radius:20px;
}

.car h2{
  margin:14px 0 8px;
}

.price{
  font-size:19px;
  font-weight:bold;
  line-height:1.5;
}

.badge{
  display:inline-block;
  margin-top:12px;
  padding:8px 12px;
  border-radius:20px;
  background:#edf6f0;
  color:#3e705a;
  font-weight:bold;
}

.badge.no{
  background:#f8eeee;
  color:#944b4b;
}

.fab{
  position:fixed;
  right:20px;
  bottom:20px;
  background:#17233d;
  color:white;
  border:0;
  padding:16px 22px;
  border-radius:30px;
  font-weight:bold;
  cursor:pointer;
  z-index:10;
}

/* MODAL */

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:100;
  overflow:auto;
}

.modal-box{
  background:white;
  max-width:600px;
  margin:40px auto;
  padding:25px;
  border-radius:25px;
}

.modal-box h2{
  margin-top:0;
}

.row{
  margin-bottom:15px;
}

.row label{
  display:block;
  margin-bottom:6px;
  font-weight:bold;
}

.row input{
  width:100%;
  padding:14px;
  border:1px solid #ccc;
  border-radius:12px;
  font-size:16px;
}

.action{
  width:100%;
  border:0;
  padding:15px;
  border-radius:15px;
  background:#365da8;
  color:white;
  font-size:16px;
  font-weight:bold;
  margin-top:8px;
  cursor:pointer;
}

.danger{
  background:#b94a4a;
}

.close{
  background:#777;
}

.car-list{
  border:1px solid #ddd;
  padding:15px;
  border-radius:15px;
  margin-bottom:12px;
}

@media(max-width:600px){
  .grid{
    grid-template-columns:repeat(2,1fr);
    gap:12px;
  }

  .car h2{
    font-size:18px;
  }

  .price{
    font-size:16px;
  }

  .hero h1{
    font-size:28px;
  }
}
</style>
</head>

<body>

<header>
  <div class="brand">
    <b>AMIR PERODUA</b>
    <small>AUTO CALCULATE SYSTEM</small>
  </div>

  <button class="edit-top" onclick="openAdmin()">⚙️ EDIT</button>
</header>

<main class="wrap">

<section class="hero">

<h1>Perodua Auto Calculator</h1>

<p id="heroText">
Masukkan bajet customer dan semak model yang sesuai.
</p>

<div class="tabs">
<button class="tab active" id="budgetTab" onclick="setMode('budget')">
💰 Bajet Bulanan
</button>

<button class="tab" id="salaryTab" onclick="setMode('salary')">
👤 Semak Gaji
</button>
</div>

<div class="input-box">
<span>RM</span>

<input
type="number"
id="amount"
placeholder="1800"
oninput="render()"
>

</div>

</section>

<div class="years">

<button class="year-btn" onclick="setYear(5,this)">5 Tahun</button>

<button class="year-btn" onclick="setYear(7,this)">7 Tahun</button>

<button class="year-btn active" onclick="setYear(9,this)">9 Tahun</button>

</div>

<div class="status">
<span class="ok" id="okCount">0 model LULUS</span>
•
<span class="no" id="noCount">0 model GAGAL</span>
</div>

<div class="budget-info" id="budgetInfo">
Masukkan bajet untuk semakan.
</div>

<div class="grid" id="carGrid"></div>

</main>

<button class="fab" onclick="openAdmin()">
✏️ EDIT HARGA / GAMBAR
</button>


<!-- ADMIN MODAL -->

<div class="modal" id="adminModal">

<div class="modal-box">

<h2>⚙️ EDIT SISTEM</h2>

<button class="action" onclick="newCar()">
➕ TAMBAH MODEL BARU
</button>

<div id="adminList"></div>

<button class="action close" onclick="closeAdmin()">
TUTUP
</button>

</div>

</div>


<!-- EDIT CAR MODAL -->

<div class="modal" id="editModal">

<div class="modal-box">

<h2 id="editTitle">EDIT MODEL</h2>

<div class="row">
<label>Nama Model</label>
<input id="editName">
</div>

<div class="row">
<label>Harga Minimum</label>
<input id="editMin" type="number">
</div>

<div class="row">
<label>Harga Maximum</label>
<input id="editMax" type="number">
</div>

<div class="row">
<label>Gambar Kereta</label>

<input
id="editImage"
type="file"
accept="image/*"
onchange="previewImage()"
>

<img
id="imagePreview"
style="width:100%;margin-top:10px;border-radius:15px;display:none;"
>
</div>

<button class="action" onclick="saveCar()">
💾 SIMPAN
</button>

<button class="action danger" onclick="deleteCar()">
🗑️ PADAM MODEL
</button>

<button class="action close" onclick="closeEdit()">
BATAL
</button>

</div>

</div>


<script>

/* =========================
DEFAULT DATA
========================= */

const defaults = [

{
name:"BEZZA",
min:36197,
max:52047,
img:"https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?auto=format&fit=crop&w=600&q=80"
},

{
name:"AXIA",
min:23276,
max:51054,
img:"https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=600&q=80"
},

{
name:"MYVI",
min:48474,
max:62302,
img:"https://images.unsplash.com/photo-1542282088-fe8426682b8f?auto=format&fit=crop&w=600&q=80"
},

{
name:"ALZA",
min:64993,
max:75200,
img:"https://images.unsplash.com/photo-1551830820-330a71b99659?auto=format&fit=crop&w=600&q=80"
},

{
name:"ATIVA",
min:62500,
max:75000,
img:"https://images.unsplash.com/photo-1504215680853-026ed2a45def?auto=format&fit=crop&w=600&q=80"
},

{
name:"ARUZ",
min:72900,
max:77900,
img:"https://images.unsplash.com/photo-1511919884226-fd3cad34687c?auto=format&fit=crop&w=600&q=80"
}

];


/* =========================
LOAD DATA
========================= */

let cars;

try{
cars = JSON.parse(localStorage.getItem("amirCars")) || defaults;
}catch(e){
cars = defaults;
}

let mode = "budget";
let years = 9;
let editing = null;


/* =========================
CALCULATE MONTHLY
========================= */

function monthly(price){

let rate = 0.0325;
let loan = price * 0.9;

let monthlyRate = rate / 12;

let months = years * 12;

let payment =
loan *
(
monthlyRate *
Math.pow(1 + monthlyRate,months)
)
/
(
Math.pow(1 + monthlyRate,months)-1
);

return payment;

}


/* =========================
GET BUDGET
========================= */

function currentAmount(){

return Number(
document.getElementById("amount").value
) || 0;

}


/* =========================
MODE
========================= */

function setMode(newMode){

mode = newMode;

document
.getElementById("budgetTab")
.classList.remove("active");

document
.getElementById("salaryTab")
.classList.remove("active");


if(mode==="budget"){

document
.getElementById("budgetTab")
.classList.add("active");

document
.getElementById("heroText")
.innerText =
"Masukkan bajet bulanan customer dan semak model yang sesuai.";

}else{

document
.getElementById("salaryTab")
.classList.add("active");

document
.getElementById("heroText")
.innerText =
"Masukkan gaji bulanan customer untuk anggaran kelayakan.";

}

render();

}


/* =========================
YEAR
========================= */

function setYear(y,button){

years = y;

document
.querySelectorAll(".year-btn")
.forEach(btn=>{
btn.classList.remove("active");
});

button.classList.add("active");

render();

}


/* =========================
RENDER
========================= */

function render(){

let amount = currentAmount();

let pass = 0;

let grid =
document.getElementById("carGrid");

grid.innerHTML = "";


cars.forEach((car,index)=>{

let eligible = false;

let estimated = monthly(car.min);


/* BAJET */

if(mode==="budget"){

eligible =
amount > 0 &&
estimated <= amount;

}


/* GAJI */

if(mode==="salary"){

let maxCommitment =
amount * 0.30;

eligible =
amount > 0 &&
estimated <= maxCommitment;

}


if(eligible){
pass++;
}


let card =
document.createElement("div");

card.className =
"car " +
(eligible ? "" : "not-ok");


card.onclick = function(){

showCar(index);

};


card.innerHTML = `

<img src="${car.img}">

<h2>${car.name}</h2>

<div class="price">
RM ${car.min.toLocaleString()}
–
RM ${car.max.toLocaleString()}
</div>

<div class="badge ${eligible ? "" : "no"}">

${eligible ? "✓ LULUS" : "✕ GAGAL"}

</div>

`;

grid.appendChild(card);

});


let fail =
cars.length - pass;


document
.getElementById("okCount")
.innerText =
pass + " model LULUS";


document
.getElementById("noCount")
.innerText =
fail + " model GAGAL";


if(mode==="budget"){

document
.getElementById("budgetInfo")
.innerText =
amount ?
"Bajet RM " +
amount.toLocaleString() +
" • Loan " +
years +
" Tahun"
:
"Masukkan bajet untuk semakan.";

}else{

document
.getElementById("budgetInfo")
.innerText =
amount ?
"Gaji RM " +
amount.toLocaleString() +
" • Anggaran komitmen 30%"
:
"Masukkan gaji untuk semakan.";

}

}


/* =========================
SHOW CAR DETAIL
========================= */

function showCar(index){

let car = cars[index];

let payment =
monthly(car.min);

alert(
car.name +
"\n\nHarga: RM " +
car.min.toLocaleString() +
" - RM " +
car.max.toLocaleString() +
"\n\nAnggaran Bulanan (" +
years +
" Tahun): RM " +
payment.toFixed(0)
);

}


/* =========================
ADMIN
========================= */

function openAdmin(){

document
.getElementById("adminModal")
.style.display = "block";

renderAdmin();

}


function closeAdmin(){

document
.getElementById("adminModal")
.style.display = "none";

}


function renderAdmin(){

let list =
document.getElementById("adminList");

list.innerHTML = "";


cars.forEach((car,index)=>{

let div =
document.createElement("div");

div.className =
"car-list";

div.innerHTML = `

<b>${car.name}</b>

<br>

RM ${car.min.toLocaleString()}
–
RM ${car.max.toLocaleString()}

<button
class="action"
onclick="editCar(${index})"
>

EDIT MODEL

</button>

`;

list.appendChild(div);

});

}


/* =========================
EDIT CAR
========================= */

function editCar(index){

editing = index;

let car = cars[index];


document
.getElementById("editTitle")
.innerText =
"EDIT " + car.name;


document
.getElementById("editName")
.value =
car.name;


document
.getElementById("editMin")
.value =
car.min;


document
.getElementById("editMax")
.value =
car.max;


document
.getElementById("imagePreview")
.src =
car.img;


document
.getElementById("imagePreview")
.style.display =
"block";


document
.getElementById("editImage")
.value = "";


document
.getElementById("editModal")
.style.display =
"block";

}


/* =========================
NEW CAR
========================= */

function newCar(){

editing = null;


document
.getElementById("editTitle")
.innerText =
"TAMBAH MODEL BARU";


document
.getElementById("editName")
.value = "";


document
.getElementById("editMin")
.value = "";


document
.getElementById("editMax")
.value = "";


document
.getElementById("editImage")
.value = "";


document
.getElementById("imagePreview")
.style.display =
"none";


document
.getElementById("editModal")
.style.display =
"block";

}


/* =========================
IMAGE PREVIEW
========================= */

function previewImage(){

let file =
document
.getElementById("editImage")
.files[0];


if(!file) return;


let reader =
new FileReader();


reader.onload =
function(e){

document
.getElementById("imagePreview")
.src =
e.target.result;


document
.getElementById("imagePreview")
.style.display =
"block";

};


reader.readAsDataURL(file);

}


/* =========================
SAVE CAR
========================= */

function saveCar(){

let name =
document
.getElementById("editName")
.value
.trim();


let min =
Number(
document
.getElementById("editMin")
.value
);


let max =
Number(
document
.getElementById("editMax")
.value
);


if(!name || !min || !max){

alert(
"Sila isi nama model dan harga."
);

return;

}


let image =
document
.getElementById("imagePreview")
.src;


let car = {

name:name,

min:min,

max:max,

img:image

};


if(editing === null){

cars.push(car);

}else{

cars[editing] =
car;

}


saveData();

closeEdit();

closeAdmin();

render();

}


/* =========================
DELETE CAR
========================= */

function deleteCar(){

if(editing === null){

closeEdit();

return;

}


let confirmDelete =
confirm(
"Padam model ini?"
);


if(!confirmDelete) return;


cars.splice(editing,1);

saveData();

closeEdit();

closeAdmin();

render();

}


/* =========================
SAVE LOCAL STORAGE
========================= */

function saveData(){

localStorage.setItem(
"amirCars",
JSON.stringify(cars)
);

}


/* =========================
CLOSE EDIT
========================= */

function closeEdit(){

document
.getElementById("editModal")
.style.display =
"none";

}


/* =========================
START
========================= */

render();

</script>

</body>
</html>
